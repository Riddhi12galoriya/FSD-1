<!-- Accordion is graphical element used for vertical stacklist mainly used for FAQ(Frequently Asked Questions) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
</head>
<body>
    <div class="accordion" id="abc">
        <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#collapseone">Accordion item #1</button>
            </h2>
            <div id="collapseone" class="accordion-collapse collapse show" data-bs-parent="#abc">
                <div class="accordion-body">This is the first item of Accordion</div>
            </div>
        </div>
    <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#collapsetwo">Accordion item #2</button>
            </h2>
            <div id="collapsetwo" class="accordion-collapse show" data-bs-parent="#abc">
                <div class="accordion-body">This is the second item of Accordion</div>
            </div>
        </div>
    <div class="accordion-item">
            <h2 class="accordion-header">
                <button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#collapsethree">Accordion item #3</button>
            </h2>
            <div id="collapsethree" class="accordion-collapse collapse" data-bs-parent="#abc">
                <div class="accordion-body">This is the third item of Accordion</div>
            </div>
        </div>
    </div>

    
</body>
</html>
