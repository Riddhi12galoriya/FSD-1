<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>

</head>
<body>
    <!-- justify content start -->
    <div class="d-flex border border-secondary border-5 p-5 bg-info justify-content-start">
        <div class="p-5 bg-primary text-white border border-warning border-3">Item-1</div>
        <div class="p-5 bg-danger text-white border border-warning border-3">Item-2</div>
        <div class="p-5 bg-success text-white border border-warning border-3">Item-3</div>
    </div>
<!-- justify content end -->
    <div class="d-flex border border-secondary border-5 p-5 bg-info justify-content-end">
        <div class="p-5 bg-primary text-white border border-warning border-3">Item-1</div>
        <div class="p-5 bg-danger text-white border border-warning border-3">Item-2</div>
        <div class="p-5 bg-success text-white border border-warning border-3">Item-3</div>
    </div>
    <!-- justify content center -->
    <div class="d-flex border border-secondary border-5 p-5 bg-info justify-content-center">
        <div class="p-5 bg-primary text-white border border-warning border-3">Item-1</div>
        <div class="p-5 bg-danger text-white border border-warning border-3">Item-2</div>
        <div class="p-5 bg-success text-white border border-warning border-3">Item-3</div>
    </div>
    <!-- justify content around -->
    <div class="d-flex border border-secondary border-5 p-5 bg-info justify-content-around">
        <div class="p-5 bg-primary text-white border border-warning border-3">Item-1</div>
        <div class="p-5 bg-danger text-white border border-warning border-3">Item-2</div>
        <div class="p-5 bg-success text-white border border-warning border-3">Item-3</div>
    </div>
    <!-- justify content between -->
    <div class="d-flex border border-secondary border-5 p-5 bg-info justify-content-between">
        <div class="p-5 bg-primary text-white border border-warning border-3">Item-1</div>
        <div class="p-5 bg-danger text-white border border-warning border-3">Item-2</div>
        <div class="p-5 bg-success text-white border border-warning border-3">Item-3</div>
    </div>
    <!-- justify content evenly -->
    <div class="d-flex border border-secondary border-5 p-5 bg-info justify-content-evenly">
        <div class="p-5 bg-primary text-white border border-warning border-3">Item-1</div>
        <div class="p-5 bg-danger text-white border border-warning border-3">Item-2</div>
        <div class="p-5 bg-success text-white border border-warning border-3">Item-3</div>
    </div>
    <!-- align content: It just works on columns  start-->
     <div class="d-flex flex-column border border-secondary border-5 p-5 bg-info align-items-start">
        <div class="p-5 bg-primary text-white border border-warning border-3">Item-1</div>
        <div class="p-5 bg-danger text-white border border-warning border-3">Item-2</div>
        <div class="p-5 bg-success text-white border border-warning border-3">Item-3</div>
    </div>

    <!-- align content: It just works on columns  end-->
     <div class="d-flex flex-column border border-secondary border-5 p-5 bg-info align-items-end">
        <div class="p-5 bg-primary text-white border border-warning border-3">Item-1</div>
        <div class="p-5 bg-danger text-white border border-warning border-3">Item-2</div>
        <div class="p-5 bg-success text-white border border-warning border-3">Item-3</div>
    </div>
    
    <!-- align content: It just works on columns  center-->
     <div class="d-flex flex-column border border-secondary border-5 p-5 bg-info align-items-center">
        <div class="p-5 bg-primary text-white border border-warning border-3">Item-1</div>
        <div class="p-5 bg-danger text-white border border-warning border-3">Item-2</div>
        <div class="p-5 bg-success text-white border border-warning border-3">Item-3</div>
    </div>
    
</body>
</html>
