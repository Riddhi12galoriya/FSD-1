<!-- Padding means distance between border and content.
Margin means distance between two objects. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box1{
            width: 300px;
            height: 150px;
            margin: 30px auto;
            padding: 20px;
            border: 4px solid red;
            box-sizing: content-box;
            background-color: lightyellow;
            text-align: center;
        }

        .box2{
            width: 300px;
            height: 150px;
            margin: 30px auto;
            padding: 20px;
            border: 4px solid yellow;
            box-sizing: border-box;
            background-color: lightblue;
            text-align: center;
        }

    </style>

</head>
<body>
    <h1>Box Properties Demonstration</h1>
    <div class="box1">Box-1: content-box</div>   
    <div class="box2">Box-2: border-box</div>
</body>
</html>
