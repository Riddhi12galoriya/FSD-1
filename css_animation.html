<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            width: 200px;
            height: 200px;
            background-color: red;
            border: 4px solid black;
            animation-name: Example;
            animation-duration: 5s;
            animation-iteration-count: 2;
            animation-timing-function: linear;
            /* animation-delay: 1s; */
            animation-direction: alternate-reverse;
            position: relative;
        }

        /* @keyframes Example{
            0%{background-color: red; top: 0px; left: 0px; border-radius: 0%;}
            25%{background-color: blue;top: 0px; left: 200px; border-radius: 20%;}
            50%{background-color: pink;top: 200px; left: 200px; border-radius: 30%;}
            75%{background-color: powderblue;top: 200px; left: 0px;  border-radius: 50%;}
            100%{background-color: palegoldenrod;top: 0px; left: 0px; border-radius: 50%;}
        }
/*  */
           @keyframes Example{
            0%{background-color: red; transform: translate(0px, 0px) rotate(0deg); border-radius: 0%;}
            25%{background-color: blue; transform: translate(100px, 200px) rotate(50deg); border-radius: 20%;}
            50%{background-color: pink; transform: translate(200px, 0px) rotate(140deg); border-radius: 30%;}
            75%{background-color: powderblue; transform: translate(300px, 200px) rotate(200deg); border-radius: 50%;}
            100%{background-color: palegoldenrod; transform: translate(400px, 0px) rotate(270deg); border-radius: 50%;}
        } 
    </style>
</head>
<body>
    <img src="sky.jpg" id="sky">
</body>
</html>
