<!doctype html>
<head>
    <meta charset="utf-8">
    <title>Table</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <table border="10", height="200", width="200", cellspacing="10", cellpadding="10", align="center", bgcolor="grey", >
        <caption>Cost Table</caption>
        <thead>
            <tr>
                <th>Name</th>
                <th>Cost</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>A</td>
                <td>20</td>
            </tr>
        </tbody>
        <tbody>
            <tr>
                <td>B</td>
                <td>30</td>
            </tr>
        </tbody>
        <tfooter>
            <tr bgcolor="white">
                <td>Total</td>
                <td>50</td>
            </tr>
        </tfooter>
    </table>
    <table border="5">
        <tr>
            <td rowspan="2">C</td>
            <td>A</td>
        </tr>
        <tr>
            <td>B</td>
        </tr>
    </table>

    <br>
    <table border="5">
        <tr>
            <td colspan="2">A</td>
        </tr>
        <tr>
            <td>C</td>
            <td>B</td>
        </tr>
    </table>

</body>
</html>
