<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 300px;
            height: 100px;
            background-color: red;
            border: 3px solid blue;
            padding: 10px;
            margin-top: 200px;
            margin-left: 200px;
        }

        div:hover{
            transform: translateX(100px);
            /* transform: translateX(100px)/translate(-200px/-300px)/translateY(300px)/translate3d(200px); */
            /* /* transform: rotate(50deg); it rotates. */
            transform: scale(100px);
        }
    </style>
</head>
<body>
    <div>Ridhi\</div>
</body>
</html>
