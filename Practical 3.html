<!-- Nested List -->
<!DOCTYPE html>
<head>
    <title>Nested List</title>
</head>
<body>
   <h1>Nested List</h1>
   <ol type="A" start="4">
        <li>List-1</li> 
        <li>List-2</li> 
        <ul type="square"><li>List-2.1</li><li>List-2.2</li></ul>   
        <ol type="I" start="3" reversed>
            <li>List-2.2.1</li>
            <li>List-2.2.2</li>
            <li>List-2.2.3</li>
        </ol>
            <li>List-3</li>
        <ul type="none">
            <li>List-3.1</li>
            <li>List-3.2</li>
        </ul>
        <li>
            <ol type="a">
                <li>List-4.1</li>
                    <ul type="circle">
                        <li>List-4.1.1</li>
                        <li>List-4.1.2</li></ul>
            </ol>
            <ol type="a" start="2">
                <li>List 4.2</li>
            </ol>
        </li>
        
    </ol>

</body>
</html>
