<!-- Write down HTML/CSS code to create table with 5 rows and 3 columns. Even number of rows display in green color and odd number of rows display in yellow color. Use External CSS file. -->

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border-style: solid;
            border-width: 5px;
            border-color: bisque;
        }
    </style>
</head>
<body>

        <tr>
            <th>Column 1</th>
            <th>Column 1</th>
            <th>Column 1</th>
        </tr>

        </tr>
        <tr>

        </tr>
        <tr>

        </tr>

    </table>
</body>
</html>
