<!-- By using attribute selector, we can change the input type height, width, background-color, color -->
 <!-- For example: name= (Textbox), we can change the size of textbox -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input[type=text]{
            width: 300px; height: 300px; background-color: blue; color: pink;
        }
        input[type=button]{
            background-color: red; font-size: 200px; height:200px; width:200px;
        }
        input[type=_blank]{
            color: red; font-size: 200px;
        }
    </style>
</head>
<body>
    <form action="" method="get">
        First name:
        <input type="text" name="name"><br><br>

        Email:
        <input type="email" name="email">
        <input type="button" value="submit">

        <a href="#" target="_blank">Link</a>
        <a href="#">Link 2</a>
    </form>
</body>
</html>
