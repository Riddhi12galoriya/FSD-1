<!-- Display Property has 4 types:
1) Inline
2) Block
3) Inline-Block 
4) None-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            background-color: lightblue;
            border: 2px solid navy;
            padding: 10px;
            margin: 5px;
            text-align: center;
        }
        .inline div{
            display: inline;
            background-color: yellow;
            border: 1px solid orange;
            padding: 5px;
        }
        .block span{
            display: block;
            background-color: cadetblue;
            border: 1px solid chocolate;
            padding: 10px;
            margin-bottom: 5px;
        }
        .inline-block div{
            display: inline-block;
            background-color:red;
            border: 4px solid rebeccapurple;
            padding: 10px;
            text-align: center;
            height: 60px;
            width: 120 px;
            margin: 5px;
        }
        .none p{
            display: none;
        }
    </style>
</head>
<body>
    <h2>Display Property</h2>
    <h3>display:inline</h3>
    <div class="inline box">
        <div>Inline-1</div>
        <div>Inline-2</div>
        <div>Inline-3</div>
    </div>

    <div class="block box">
        <span>Block-1</span>
        <span>Block-2</span>
        <span>Block 3</span>
    </div>
    <h2>display block</h2>
    <div class="inline-block">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box-3</div>
    </div>
    <h3>display none</h3>
    <div class="none box"><p>The text is hidden using display:none</p></div>
    <p>The hidden text doesnot take any space on the page.</p>
</body>
</html>
