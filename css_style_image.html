<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #img1{
            border: 5px solid plum;
            border-radius: 10px;
            width: 300px;
            height: 300px;
        }

        #img2{
            border: 5px solid plum;
            border-radius: 50%;
            width: 300px;
            height: 300px;
        }

        #thumbnail{
            padding: 30px;
            background-color: black;
            border: 5px solid red;
            border-radius: 30px;
            width: 300px;
            height: 300px;
        }

        #transparent{
            border: 5px solid red;
            border-radius: 30px;
            height: 300px;
            width: 300px;
            opacity: 0.5;
        }

        #responsive{
            border: 5px solid red;
            border-radius: 30px;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <img src="Himanshu-Awasthi.jpg" id="img1">
    <hr>
    <img src="Himanshu-Awasthi.jpg" id="img2">
    <hr>
    <img src="Himanshu-Awasthi.jpg" id="thumbnail">
    <hr>
    <img src="Himanshu-Awasthi.jpg" id="transparent">
    <hr>
    <img src="Himanshu-Awasthi.jpg" id="responsive">
    
</body>
</html>
