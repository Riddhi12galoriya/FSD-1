<!-- Pseudo Element Types:
1)::first-line
2)::first-letter
3)::before
4)::after
5)::marker
6)::selection -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* ::first-line */
        p::first-line{
            color: darkcyan;
            background-color: bisque;     
        }
        /* ::first-letter */
        p::first-letter{
            font-size: 30px;
        }
        /* ::before */
        p::before{
            content: "Note:";
            color: darkorchid;
        }
        /* ::after */
        p::after{
            content: "❤🍒😉❄";
        }
        /* ::marker */
        ul li::marker{
            color: mediumseagreen;
        }
        /* selection */
        ::selection{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <p>-------------------------Pseudo Element-----------------------</p>
    <ul>
        <li>List 1</li>
        <li>List 2</li>
    </ul>

</body>
</html>
